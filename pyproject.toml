[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hztz"
version = "0.1.0"
description = "Turn 'I don't know what' in your Technical Specs into actionable tasks and questions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Spectrum IT / R&D" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.7.0",
    "jsonschema>=4.21.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "openai>=1.40.0",
    "referencing>=0.30.0",
]

[project.scripts]
hz = "hztz.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hztz"]

[tool.hatch.build.targets.wheel.force-include]
"src/hztz/prompts" = "hztz/prompts"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-jsonschema>=4.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
